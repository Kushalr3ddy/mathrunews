<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — MSM TV NEWS</title>
  <meta name="description" content="Contact the MSM TV NEWS desk — story tips, news telecast requests and enquiries.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1c3f'/%3E%3Ctext x='16' y='24' font-family='Georgia' font-size='22' font-weight='700' text-anchor='middle' fill='%23d4af37'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Anek+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <header id="site-header"></header>
  <div class="ticker" id="ticker"></div>
  <main class="wrap">
    <section class="page-hero">
      <h1 id="ct-title"></h1>
      <p id="ct-sub"></p>
    </section>
    <div class="two-col">
      <div class="contact-card" id="ct-info"></div>
      <div class="contact-card">
        <form class="msm-form" id="ct-form"></form>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/forms.js"></script>
  <script>
    initChrome("contact");
    var b = MSM.brand;
    document.getElementById("ct-title").textContent = t("contact_title");
    document.getElementById("ct-sub").textContent = t("contact_sub");
    document.getElementById("ct-info").innerHTML =
      contactItem("✆", t("call_us"), '<a href="tel:'+b.phoneRaw+'">'+b.phone+'</a>') +
      contactItem("✉", t("email_us"), '<a href="mailto:'+b.email+'">'+b.email+'</a>') +
      contactItem("⌖", t("address_label"), '<span>'+L(b.address)+'</span>') +
      contactItem("◷", "24 × 7", '<span>'+t("hours")+'</span>') +
      contactItem("♺", t("follow"), socialRow(b));
    buildForm("ct-form", t("contact_title"));
  </script>
</body>
</html>
