<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live TV — MSM TV NEWS</title>
  <meta name="description" content="MSM TV NEWS 24x7 live stream — launching soon.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1c3f'/%3E%3Ctext x='16' y='24' font-family='Georgia' font-size='22' font-weight='700' text-anchor='middle' fill='%23d4af37'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Anek+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="live">
  <header id="site-header"></header>
  <div class="ticker" id="ticker"></div>
  <main class="wrap">
    <section class="live-stage">
      <span class="live-badge"><span class="dot"></span><span id="lv-badge">LIVE</span></span>
      <div class="live-screen" id="lv-screen"></div>
      <h1 id="lv-title"></h1>
      <p id="lv-sub"></p>
      <a class="btn-gold" id="lv-btn" href="#"></a>
    </section>

    <div class="section-head"><h2 id="lv-top"></h2><span class="line"></span></div>
    <div class="cards cards-3" id="lv-latest"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initChrome("live");
    document.getElementById("lv-badge").textContent = t("live_now");
    document.getElementById("lv-screen").innerHTML = msmLogo(90);
    document.getElementById("lv-title").textContent = t("live_soon");
    document.getElementById("lv-sub").textContent = t("live_soon_sub");
    var btn = document.getElementById("lv-btn");
    btn.textContent = t("notify_me");
    btn.href = "https://wa.me/" + MSM.brand.phoneRaw;
    document.getElementById("lv-top").textContent = t("top_stories");
    document.getElementById("lv-latest").innerHTML = sortByDate(MSM.articles).slice(0,6).map(function(a){return card(a);}).join("");
  </script>
</body>
</html>
